<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Detalle de Barbero — Barbería</title>
  <link rel="stylesheet" href="css/barberia.css"/>
  <style>
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--carbon-40);
      font-weight: 600;
      font-size: .875rem;
      transition: color var(--speed);
      cursor: pointer;
      border: none;
      background: none;
      padding: 6px 0;
    }
    .btn-back:hover { color: var(--carbon); }
    .recibo-card {
      padding: 16px 20px;
      border-bottom: 1px solid var(--beige);
      font-size: .875rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      animation: fadeIn .2s var(--ease);
    }
    .recibo-card:last-child { border-bottom: none; }
    .rc-left { flex: 1; }
    .rc-meta { font-size: .78rem; color: var(--carbon-40); margin-top: 3px; }
    .rc-items { margin-top: 6px; color: var(--carbon); font-weight: 500; }
    .rc-total { font-weight: 700; color: var(--oliva); font-size: 1rem; text-align: right; }
  </style>
</head>
<body>
<div id="sidebarMount"></div>

<div class="app-shell">
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-hamburger" id="btnHamburger" aria-label="Menú">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/>
            <line x1="4" x2="20" y1="18" y2="18"/>
          </svg>
        </button>
        <span class="topbar-title">Detalle de Barbero</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-date" id="liveClock"></span>
      </div>
    </header>

    <main class="page-body">
      <div style="margin-bottom:20px" class="fade-in">
        <button class="btn-back" id="btnBack">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" x2="5" y1="12" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          Volver a Barberos
        </button>
        <h1 id="barberoNombre" style="margin-top:10px">—</h1>
        <p style="margin-top:4px;font-size:.9rem" id="barberoEstado">Cargando información...</p>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid fade-in" style="animation-delay:.05s">
        <div class="stat-card">
          <div class="stat-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
              <line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/>
            </svg>
          </div>
          <div class="stat-label">Total servicios</div>
          <div class="stat-value" id="statServicios">0</div>
          <div class="stat-sub">servicios realizados</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <div class="stat-label">Total recaudado</div>
          <div class="stat-value" id="statRecaudado" style="color:var(--oliva)">$0</div>
          <div class="stat-sub">ingresos brutos totales</div>
        </div>
      </div>

      <!-- Historial -->
      <div class="card fade-in" style="animation-delay:.1s">
        <div class="card-header">
          <h3 class="card-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/>
            </svg>
            Historial de servicios y ventas
          </h3>
        </div>
        <div id="listVentas">
          <div style="padding:24px;text-align:center;color:var(--carbon-40)">Cargando historial...</div>
        </div>
      </div>
    </main>
  </div>
</div>

<script type="module">
import { requireAuth, initSidebar, startClock, api, formatMoney, formatDate, renderSidebarHTML, toast } from "./js/barberia-core.js";

requireAuth();
document.getElementById("sidebarMount").innerHTML = renderSidebarHTML();
initSidebar("barberos.html");
startClock(document.getElementById("liveClock"));

document.getElementById("btnBack").onclick = () => {
  window.location.href = "barberos.html";
};

const urlParams = new URLSearchParams(window.location.search);
const barberoId = urlParams.get("id");

if (!barberoId) {
  window.location.href = "barberos.html";
}

async function loadDetalle() {
  try {
    const barberos = await api("/barberos");
    const b = barberos.find(x => x._id === barberoId);
    if (!b) {
      toast("Barbero no encontrado", "error");
      setTimeout(() => window.location.href = "barberos.html", 1500);
      return;
    }
    document.getElementById("barberoNombre").textContent = b.nombre;
    document.getElementById("barberoEstado").innerHTML = b.activo
      ? `<span class="badge badge-active">Activo</span>`
      : `<span class="badge badge-inactive">Inactivo</span>`;

    const ventas = await api(`/ventas?barberoId=${barberoId}`);

    const totalServicios = ventas.length;
    const totalRecaudado = ventas.reduce((s, v) => s + v.total, 0);

    document.getElementById("statServicios").textContent = totalServicios;
    document.getElementById("statRecaudado").textContent = formatMoney(totalRecaudado);

    const container = document.getElementById("listVentas");
    if (ventas.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/>
          </svg>
          <h3>Sin actividad</h3>
          <p>Este barbero aún no ha realizado ningún servicio.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = ventas.map(v => {
      const itemsDesc = v.items.map(it => `${it.cantidad > 1 ? `${it.cantidad}× ` : ""}${it.nombre}`).join(" · ");
      const pagoLabel = v.metodoPago === "transferencia" ? "Transferencia" : "Efectivo";
      return `
        <div class="recibo-card">
          <div class="rc-left">
            <strong>Recibo #${v.numeroRecibo}</strong>
            <div class="rc-items">${itemsDesc}</div>
            <div class="rc-meta">${formatDate(v.fecha)} · ${pagoLabel}</div>
          </div>
          <div class="rc-right">
            <div class="rc-total">${formatMoney(v.total)}</div>
          </div>
        </div>
      `;
    }).join("");

  } catch(e) {
    toast("Error cargando detalles: " + e.message, "error");
  }
}

loadDetalle();
</script>
</body>
</html>
