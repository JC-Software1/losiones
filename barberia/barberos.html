<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Barberos — Barbería</title>
  <link rel="stylesheet" href="css/barberia.css"/>
</head>
<body>
<div id="sidebarMount"></div>

<div class="app-shell">
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-hamburger" id="btnHamburger" aria-label="Menú">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/>
            <line x1="4" x2="20" y1="18" y2="18"/>
          </svg>
        </button>
        <span class="topbar-title">Barberos</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-date" id="liveClock"></span>
      </div>
    </header>

    <main class="page-body">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px" class="fade-in">
        <div>
          <h1>Barberos</h1>
          <p style="margin-top:4px;font-size:.9rem">Administra el equipo de trabajo</p>
        </div>
        <button class="btn btn-primary" id="btnAgregar">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/>
          </svg>
          Agregar barbero
        </button>
      </div>

      <div class="card fade-in" style="animation-delay:.06s">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Estado</th>
                <th>Registrado</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbodyBarberos">
              <tr><td colspan="4"><div class="skeleton" style="height:14px;width:50%;margin:8px 0"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal agregar/editar -->
<div class="modal-overlay" id="modalBarbero">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Nuevo barbero</h3>
      <button class="modal-close" id="btnCerrarModal">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label" for="inputNombre">Nombre del barbero</label>
        <input class="form-input" id="inputNombre" type="text" placeholder="Ej: Andrés García" autocomplete="off"/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btnCancelar">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardar">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal confirmar eliminar -->
<div class="modal-overlay" id="modalEliminar">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <h3 class="modal-title">Eliminar barbero</h3>
      <button class="modal-close" id="btnCerrarEliminar">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <p>¿Seguro que deseas eliminar a <strong id="nombreEliminar"></strong>? Esta acción no se puede deshacer.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btnCancelarEliminar">Cancelar</button>
      <button class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
    </div>
  </div>
</div>

<script type="module">
import { requireAuth, initSidebar, startClock, api, formatDate, renderSidebarHTML, toast, openModal, closeModal } from "./js/barberia-core.js";

requireAuth();
document.getElementById("sidebarMount").innerHTML = renderSidebarHTML();
initSidebar("barberos.html");
startClock(document.getElementById("liveClock"));

let editingId = null;
let deletingId = null;
let barberos = [];

// Load
async function loadBarberos() {
  try {
    barberos = await api("/barberos");
    renderTable();
  } catch(e) { toast("Error cargando barberos: " + e.message, "error"); }
}

function renderTable() {
  const tbody = document.getElementById("tbodyBarberos");
  if (barberos.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4">
      <div class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
        </svg>
        <h3>Sin barberos</h3>
        <p>Agrega tu primer barbero para comenzar</p>
      </div>
    </td></tr>`;
    return;
  }
  tbody.innerHTML = barberos.map(b => `
    <tr class="fade-in" style="cursor:pointer" onclick="verDetalleBarbero(event, '${b._id}')">
      <td><strong>${b.nombre}</strong></td>
      <td>
        <span class="badge ${b.activo ? "badge-active" : "badge-inactive"}">
          ${b.activo ? "Activo" : "Inactivo"}
        </span>
      </td>
      <td class="muted">${formatDate(b.createdAt)}</td>
      <td>
        <div style="display:flex;gap:6px;justify-content:flex-end">
          <button class="btn btn-ghost btn-sm btn-icon" onclick="editarBarbero('${b._id}')" title="Editar">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
          </button>
          <button class="btn btn-ghost btn-sm btn-icon" onclick="toggleActivo('${b._id}',${b.activo})" title="${b.activo ? "Desactivar" : "Activar"}">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              ${b.activo
                ? '<path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" x2="12" y1="2" y2="12"/>'
                : '<path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/>'}
            </svg>
          </button>
          <button class="btn btn-danger btn-sm btn-icon" onclick="pedirEliminar('${b._id}','${b.nombre}')" title="Eliminar">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </td>
    </tr>
  `).join("");
}

// Open modal (new)
document.getElementById("btnAgregar").onclick = () => {
  editingId = null;
  document.getElementById("modalTitle").textContent = "Nuevo barbero";
  document.getElementById("inputNombre").value = "";
  openModal("modalBarbero");
  document.getElementById("inputNombre").focus();
};

// Close modals
["btnCerrarModal","btnCancelar"].forEach(id =>
  document.getElementById(id).onclick = () => closeModal("modalBarbero")
);
["btnCerrarEliminar","btnCancelarEliminar"].forEach(id =>
  document.getElementById(id).onclick = () => closeModal("modalEliminar")
);

// Save
document.getElementById("btnGuardar").onclick = async () => {
  const nombre = document.getElementById("inputNombre").value.trim();
  if (!nombre) { toast("El nombre es obligatorio", "error"); return; }
  const btn = document.getElementById("btnGuardar");
  btn.disabled = true; btn.textContent = "Guardando...";
  try {
    if (editingId) {
      await api(`/barberos/${editingId}`, "PATCH", { nombre });
      toast("Barbero actualizado");
    } else {
      await api("/barberos", "POST", { nombre });
      toast("Barbero agregado");
    }
    closeModal("modalBarbero");
    await loadBarberos();
  } catch(e) { toast(e.message, "error"); }
  finally { btn.disabled = false; btn.textContent = "Guardar"; }
};

// Editar
window.editarBarbero = (id) => {
  const b = barberos.find(x => x._id === id);
  if (!b) return;
  editingId = id;
  document.getElementById("modalTitle").textContent = "Editar barbero";
  document.getElementById("inputNombre").value = b.nombre;
  openModal("modalBarbero");
  document.getElementById("inputNombre").focus();
};

// Toggle activo
window.toggleActivo = async (id, activo) => {
  try {
    await api(`/barberos/${id}`, "PATCH", { activo: !activo });
    toast(!activo ? "Barbero activado" : "Barbero desactivado");
    await loadBarberos();
  } catch(e) { toast(e.message, "error"); }
};

// Eliminar
window.pedirEliminar = (id, nombre) => {
  deletingId = id;
  document.getElementById("nombreEliminar").textContent = nombre;
  openModal("modalEliminar");
};
document.getElementById("btnConfirmarEliminar").onclick = async () => {
  const btn = document.getElementById("btnConfirmarEliminar");
  btn.disabled = true; btn.textContent = "Eliminando...";
  try {
    await api(`/barberos/${deletingId}`, "DELETE");
    toast("Barbero eliminado");
    closeModal("modalEliminar");
    await loadBarberos();
  } catch(e) { toast(e.message, "error"); }
  finally { btn.disabled = false; btn.textContent = "Eliminar"; }
};

// Close modal on overlay click
document.querySelectorAll(".modal-overlay").forEach(overlay => {
  overlay.addEventListener("click", e => {
    if (e.target === overlay) overlay.classList.remove("open");
  });
});

// Enter key in input
document.getElementById("inputNombre").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("btnGuardar").click();
});

window.verDetalleBarbero = (e, id) => {
  if (e.target.closest("button") || e.target.closest("svg") || e.target.closest("a")) return;
  window.location.href = `detalle-barbero.html?id=${id}`;
};

loadBarberos();
</script>
</body>
</html>
