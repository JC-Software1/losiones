<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de la Venta</title>
    <script src="adminMode.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --purple: #9333ea;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #374151;
            --gray-700: #1f2937;
            --gray-800: #111827;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--gray-50) 0%, var(--gray-100) 100%);
            color: var(--gray-800);
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            gap: 2rem;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .back-btn {
            background: white;
            border: 1px solid var(--gray-200);
            color: var(--gray-600);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            transition: all 0.2s;
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--gray-50);
            color: var(--primary);
            transform: translateX(-2px);
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gray-800);
            margin: 0;
        }

        .customer-card {
            background: white;
            border-radius: 1rem;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid var(--gray-200);
        }

        .customer-header {
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            color: white;
            padding: 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .initials-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            border: 4px solid rgba(255, 255, 255, 0.2);
            user-select: none;
        }

        .customer-info h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .customer-id {
            font-size: 0.875rem;
            opacity: 0.8;
        }

        .customer-badge {
            margin-left: auto;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-paid { background: var(--success); }
        .badge-pending { background: var(--danger); }
        .badge-partial { background: var(--warning); }

        .customer-body {
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .info-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--gray-50);
            border-radius: 0.5rem;
            border: 1px solid var(--gray-200);
        }

        .info-group i {
            color: var(--primary);
            font-size: 1.125rem;
            width: 20px;
            text-align: center;
        }

        .info-content {
            flex: 1;
        }

        .info-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray-800);
            margin-top: 0.25rem;
        }

        .payment-status {
            background: white;
            border-radius: 1rem;
            box-shadow: var(--shadow);
            padding: 2rem;
            text-align: center;
            border: 1px solid var(--gray-200);
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-size: 1.125rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-paid { background: var(--success); color: white; }
        .status-pending { background: var(--danger); color: white; }
        .status-partial { background: var(--warning); color: white; }

        .progress-section {
            margin-top: 1.5rem;
        }

        .progress-bar {
            background: var(--gray-200);
            height: 0.75rem;
            border-radius: 9999px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success) 0%, #10b981 100%);
            transition: width 0.5s ease;
        }

        .progress-text {
            font-size: 0.875rem;
            color: var(--gray-600);
        }

        /* ========================================
           CALENDARIO COMPLETO - ESTILO MEJORADO
           ======================================== */
        .payment-calendar {
            background: white;
            border-radius: 1rem;
            box-shadow: var(--shadow);
            padding: 2rem;
            border: 1px solid var(--gray-200);
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .calendar-header h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-800);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .calendar-legend {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-paid { background: var(--success); }
        .legend-pending { background: var(--danger); }
        .legend-today { background: var(--primary); }
        .legend-scheduled { background: var(--purple); }

        /* Navegación del calendario */
        .calendar-navigation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--gray-50);
            border-radius: 0.5rem;
        }

        .nav-btn {
            background: white;
            border: 1px solid var(--gray-300);
            color: var(--gray-700);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        .nav-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .current-month {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gray-800);
        }

        /* Grid del calendario */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .day-header {
            text-align: center;
            font-weight: 700;
            color: var(--gray-600);
            padding: 0.75rem;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            background: var(--gray-50);
            color: var(--gray-500);
        }

        .day-cell.current-month {
            background: white;
            color: var(--gray-800);
            border: 1px solid var(--gray-200);
        }

        .day-cell.scheduled {
            background: linear-gradient(135deg, var(--purple) 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(147, 51, 234, 0.3);
            font-weight: 700;
        }

        .day-cell.today {
            border: 3px solid var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
            background: rgba(37, 99, 235, 0.1);
        }

        .day-cell.paid {
            background: linear-gradient(135deg, var(--success) 0%, #10b981 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(5, 150, 105, 0.3);
        }

        .day-cell.overdue {
            background: linear-gradient(135deg, var(--danger) 0%, #ef4444 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .day-cell:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .day-cell::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            opacity: 0;
        }

        .day-cell.has-payment::after {
            opacity: 1;
            background: white;
        }

        .installments-breakdown {
            background: var(--gray-50);
            border-radius: 0.75rem;
            padding: 1.5rem;
            border: 1px solid var(--gray-200);
        }

        .breakdown-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .breakdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }

        .breakdown-item {
            text-align: center;
            padding: 1rem;
            background: white;
            border-radius: 0.5rem;
            border: 1px solid var(--gray-200);
        }

        .breakdown-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .breakdown-label {
            font-size: 0.75rem;
            color: var(--gray-500);
            margin-top: 0.25rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .payments-history {
            background: white;
            border-radius: 1rem;
            box-shadow: var(--shadow);
            padding: 2rem;
            border: 1px solid var(--gray-200);
        }

        .payments-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .payments-table th,
        .payments-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--gray-200);
        }

        .payments-table th {
            background: var(--gray-50);
            font-weight: 600;
            color: var(--gray-700);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .payment-amount {
            color: var(--success);
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--gray-500);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .container {
                gap: 1rem;
            }

            .customer-header {
                flex-direction: column;
                text-align: center;
                padding: 1.5rem;
            }

            .customer-badge {
                margin: 0;
            }

            .customer-body {
                grid-template-columns: 1fr;
                padding: 1.5rem;
            }

            .calendar-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .calendar-grid {
                gap: 0.25rem;
            }

            .day-cell {
                font-size: 0.875rem;
            }

            .page-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="categories.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                Volver
            </a>
            <h1 class="page-title">Detalles de la Venta</h1>
        </div>

        <div class="customer-card">
            <div class="customer-header">
                <div id="customerAvatar" class="initials-avatar"></div>
                <div class="customer-info">
                    <h2 id="customerName">Cargando...</h2>
                    <p class="customer-id" id="customerId">#000000</p>
                </div>
                <div class="customer-badge" id="customerBadge">Cargando</div>
            </div>
            <div class="customer-body" id="customerDetails"></div>
        </div>

        <div class="payment-status">
            <div class="status-indicator" id="paymentStatusBadge">
                <i class="fas fa-spinner fa-spin"></i>
                Cargando...
            </div>
            <div class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                </div>
                <p class="progress-text" id="progressText">0% completado</p>
            </div>
        </div>

        <div class="payment-calendar">
            <div class="calendar-header">
                <h3><i class="fas fa-calendar-alt"></i> Calendario de Pagos</h3>
                <div class="calendar-legend">
                    <div class="legend-item">
                        <div class="legend-dot legend-scheduled"></div>
                        Programado
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot legend-paid"></div>
                        Pagado
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot legend-pending"></div>
                        Atrasado
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot legend-today"></div>
                        Hoy
                    </div>
                </div>
            </div>
            
            <div class="calendar-navigation">
                <button class="nav-btn" id="prevMonth">
                    <i class="fas fa-chevron-left"></i>
                    Anterior
                </button>
                <div class="current-month" id="currentMonthDisplay">Octubre 2025</div>
                <button class="nav-btn" id="nextMonth">
                    Siguiente
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>

            <div class="calendar-grid" id="calendarGrid"></div>
            
            <div class="installments-breakdown" id="installmentsBreakdown"></div>
        </div>

        <div class="payments-history">
            <h3><i class="fas fa-history"></i> Historial de Abonos</h3>
            <div id="paymentsTableContainer"></div>
        </div>
    </div>

    <script>
        let currentCalendarDate = new Date();
        let saleData = null;

        document.addEventListener("DOMContentLoaded", () => {
            const sale = JSON.parse(localStorage.getItem("saleDetails"));
            
            if (!sale) {
                document.body.innerHTML = `
                    <div class="container">
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <h3>No hay detalles disponibles</h3>
                            <p>No se encontraron datos de la venta.</p>
                            <a href="categories.html" class="back-btn" style="margin-top: 1rem;">
                                <i class="fas fa-arrow-left"></i>
                                Volver
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            saleData = sale;
            loadSaleDetails(sale);
            setupCalendarNavigation();
        });

        function loadSaleDetails(sale) {
            const totalPaid = sale.totalPaid || (sale.payments ? sale.payments.reduce((sum, payment) => sum + Number(payment.amount || 0), 0) : 0) || 0;
            const remainingDebt = Number(sale.price || 0) - totalPaid;
            const paymentPercentage = Number(sale.price) ? (totalPaid / Number(sale.price)) * 100 : 0;

            const formatCurrency = (value) => {
                return new Intl.NumberFormat('es-CO', {
                    style: 'currency',
                    currency: 'COP',
                    minimumFractionDigits: 0
                }).format(value);
            };

            const avatar = document.getElementById('customerAvatar');
            const initial = sale.clientName ? sale.clientName.charAt(0).toUpperCase() : '?';
            avatar.textContent = initial;
            document.getElementById('customerName').textContent = sale.clientName;
            document.getElementById('customerId').textContent = `#${sale._id.slice(-6)}`;

            const badge = document.getElementById('customerBadge');
            if (remainingDebt <= 0) {
                badge.className = 'customer-badge badge-paid';
                badge.textContent = 'Pagado';
            } else if (totalPaid <= 0) {
                badge.className = 'customer-badge badge-pending';
                badge.textContent = 'Pendiente';
            } else {
                badge.className = 'customer-badge badge-partial';
                badge.textContent = 'Parcial';
            }

            const customerDetails = document.getElementById('customerDetails');
            customerDetails.innerHTML = `
                <div class="info-group">
                    <i class="fas fa-box"></i>
                    <div class="info-content">
                        <div class="info-label">Producto</div>
                        <div class="info-value">${escapeHtml(sale.productName || 'No especificado')}</div>
                    </div>
                </div>
                <div class="info-group">
                    <i class="fas fa-calendar"></i>
                    <div class="info-content">
                        <div class="info-label">Fecha de Venta</div>
                        <div class="info-value">${formatDate(sale.saleDate)}</div>
                    </div>
                </div>
                <div class="info-group">
                    <i class="fas fa-map-marker-alt"></i>
                    <div class="info-content">
                        <div class="info-label">Dirección</div>
                        <div class="info-value">${escapeHtml(sale.clientAddress || 'No registrada')}</div>
                    </div>
                </div>
                <div class="info-group">
                    <i class="fas fa-dollar-sign"></i>
                    <div class="info-content">
                        <div class="info-label">Precio Total</div>
                        <div class="info-value">${formatCurrency(sale.price || 0)}</div>
                    </div>
                </div>
                <div class="info-group">
                    <i class="fas fa-credit-card"></i>
                    <div class="info-content">
                        <div class="info-label">Total Abonado</div>
                        <div class="info-value" style="color: var(--success);">${formatCurrency(totalPaid)}</div>
                    </div>
                </div>
                <div class="info-group">
                    <i class="fas fa-exclamation-triangle"></i>
                    <div class="info-content">
                        <div class="info-label">Deuda Restante</div>
                        <div class="info-value" style="color: var(--danger);">${formatCurrency(remainingDebt)}</div>
                    </div>
                </div>
            `;

            const statusBadge = document.getElementById('paymentStatusBadge');
            const progressSection = document.getElementById('progressSection');
            
            if (remainingDebt <= 0) {
                statusBadge.innerHTML = '<i class="fas fa-check-circle"></i> PAGADO EN SU TOTALIDAD';
                statusBadge.className = 'status-indicator status-paid';
            } else if (totalPaid <= 0) {
                statusBadge.innerHTML = '<i class="fas fa-exclamation-triangle"></i> PENDIENTE DE PAGO';
                statusBadge.className = 'status-indicator status-pending';
            } else {
                statusBadge.innerHTML = '<i class="fas fa-clock"></i> PAGO PARCIAL';
                statusBadge.className = 'status-indicator status-partial';
                
                progressSection.style.display = 'block';
                document.getElementById('progressFill').style.width = `${paymentPercentage}%`;
                document.getElementById('progressText').textContent = `${paymentPercentage.toFixed(1)}% completado`;
            }

            renderFullCalendar(sale);
            renderPaymentsHistory(sale);
        }

        function setupCalendarNavigation() {
            document.getElementById('prevMonth').addEventListener('click', () => {
                currentCalendarDate.setMonth(currentCalendarDate.getMonth() - 1);
                renderFullCalendar(saleData);
            });

            document.getElementById('nextMonth').addEventListener('click', () => {
                currentCalendarDate.setMonth(currentCalendarDate.getMonth() + 1);
                renderFullCalendar(saleData);
            });
        }

        function renderFullCalendar(sale) {
            const calendarGrid = document.getElementById('calendarGrid');
            const monthDisplay = document.getElementById('currentMonthDisplay');
            const breakdown = document.getElementById('installmentsBreakdown');

            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();

            monthDisplay.textContent = new Date(year, month).toLocaleDateString('es-CO', {
                month: 'long',
                year: 'numeric'
            });

            // Parsear días de pago programados
            const scheduledDays = [];
            if (sale.paymentDays) {
                const parts = sale.paymentDays.split('|');
                if (parts.length === 2) {
                    const days = parts[1].split(',').map(d => parseInt(d.trim())).filter(n => !isNaN(n));
                    scheduledDays.push(...days);
                }
            }

            // Obtener días con pagos realizados
            const paidDates = new Set();
            (sale.payments || []).forEach(p => {
                const d = parseDateLocal(p.date);
                if (!isNaN(d)) {
                    paidDates.add(d.toISOString().slice(0, 10));
                }
            });

            // Obtener primer y último día del mes
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const firstDayOfWeek = firstDay.getDay();

            // Día actual
            const today = new Date();
            const todayStr = today.toISOString().slice(0, 10);

            calendarGrid.innerHTML = '';

            // Headers de días de la semana
            const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            dayNames.forEach(name => {
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = name;
                calendarGrid.appendChild(header);
            });

            // Días vacíos antes del primer día
            for (let i = 0; i < firstDayOfWeek; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell';
                calendarGrid.appendChild(emptyCell);
            }

            // Contador de estados
            let scheduledCount = 0;
            let paidCount = 0;
            let overdueCount = 0;

            // Renderizar días del mes
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell current-month';
                cell.textContent = day;

                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const cellDate = new Date(year, month, day);

                // Verificar si es día programado
                const isScheduled = scheduledDays.includes(day);
                
                // Verificar si tiene pago
                const hasPaid = paidDates.has(dateStr);

                // Verificar si es hoy
                const isToday = dateStr === todayStr;

                // Lógica de colores
                if (hasPaid) {
                    // VERDE: Tiene pago
                    cell.classList.add('paid');
                    cell.classList.add('has-payment');
                    paidCount++;
                } else if (isScheduled) {
                    // MORADO: Día programado
                    cell.classList.add('scheduled');
                    scheduledCount++;
                    
                    // ROJO: Si ya pasó y no hay pago (atrasado)
                    if (cellDate < today) {
                        cell.classList.remove('scheduled');
                        cell.classList.add('overdue');
                        overdueCount++;
                        scheduledCount--;
                    }
                } 

                // AZUL: Si es hoy (borde azul)
                if (isToday) {
                    cell.classList.add('today');
                }

                calendarGrid.appendChild(cell);
            }

            // Resumen
            breakdown.innerHTML = `
                <div class="breakdown-title"><i class="fas fa-calculator"></i> Resumen del mes</div>
                <div class="breakdown-grid">
                    <div class="breakdown-item">
                        <div class="breakdown-value" style="color: var(--purple);">${scheduledCount}</div>
                        <div class="breakdown-label">Programados</div>
                    </div><div class="breakdown-item">
                        <div class="breakdown-value" style="color: var(--success);">${paidCount}</div>
                        <div class="breakdown-label">Pagados</div>
                    </div>
                    <div class="breakdown-item">
                        <div class="breakdown-value" style="color: var(--danger);">${overdueCount}</div>
                        <div class="breakdown-label">Atrasados</div>
                    </div>
                    <div class="breakdown-item">
                        <div class="breakdown-value">${daysInMonth}</div>
                        <div class="breakdown-label">Días totales</div>
                    </div>
                </div>`;
        }

        function renderPaymentsHistory(sale) {
            const container = document.getElementById('paymentsTableContainer');
            
            if (!sale.payments || sale.payments.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-receipt"></i>
                        <h3>No hay abonos registrados</h3>
                        <p>Aún no se han registrado pagos para esta venta.</p>
                    </div>
                `;
                return;
            }

            const formatCurrency = (value) => {
                return new Intl.NumberFormat('es-CO', {
                    style: 'currency',
                    currency: 'COP',
                    minimumFractionDigits: 0
                }).format(value);
            };

            const sortedPayments = [...sale.payments].sort((a, b) => new Date(b.date) - new Date(a.date));

            container.innerHTML = `
                <table class="payments-table">
                    <thead>
                        <tr>
                            <th>Fecha de Abono</th>
                            <th>Monto</th>
                            <th>Día del Mes</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sortedPayments.map(payment => {
                            const localDate = parseDateLocal(payment.date);
                            const dayOfMonth = localDate.getDate();
                            
                            return `
                                <tr>
                                    <td>${formatDate(payment.date)}</td>
                                    <td class="payment-amount">${formatCurrency(payment.amount)}</td>
                                    <td><span style="background: var(--primary); color: white; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.875rem;">${dayOfMonth}</span></td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        function formatDate(dateString) {
            if (!dateString) return 'Fecha inválida';
            
            const date = parseDateLocal(dateString);
            return date.toLocaleDateString('es-CO', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            if (text === undefined || text === null) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function parseDateLocal(dateString) {
            if (!dateString) return new Date(NaN);
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
                const [y, m, d] = dateString.split('-').map(Number);
                return new Date(y, m - 1, d);
            }
            if (/Z$|[+-]\d{2}:\d{2}$/.test(dateString)) {
                const d = new Date(dateString);
                return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(),
                                d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds());
            }
            return new Date(dateString);
        }
        
        function refreshSaleDetails() {
            const saleRaw = localStorage.getItem('saleDetails');
            if (!saleRaw) return;
            try {
                const sale = JSON.parse(saleRaw);
                saleData = sale;
                loadSaleDetails(sale);
            } catch (err) {
                console.error('No se pudo parsear saleDetails desde localStorage', err);
            }
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'saleDetails') {
                refreshSaleDetails();
            }
        });

        window.addEventListener('saleUpdated', (e) => {
            refreshSaleDetails();
        });

        function saveSaleToStorage(sale) {
            localStorage.setItem('saleDetails', JSON.stringify(sale));
            window.dispatchEvent(new Event('saleUpdated'));
        }

        function removePaymentDayFromSale(dayValueOrIndex) {
            const saleRaw = localStorage.getItem('saleDetails');
            if (!saleRaw) return;
            const sale = JSON.parse(saleRaw);

            const payments = (sale.paymentDays || '')
                .split(',')
                .map(s => s.trim())
                .filter(s => s !== '')
                .map(Number)
                .filter(n => !isNaN(n));

            let newPayments;
            if (typeof dayValueOrIndex === 'number') {
                if (payments.includes(dayValueOrIndex)) {
                    newPayments = payments.filter(d => d !== dayValueOrIndex);
                } else {
                    newPayments = payments.slice();
                    newPayments.splice(dayValueOrIndex, 1);
                }
            } else {
                const v = Number(dayValueOrIndex);
                newPayments = payments.filter(d => d !== v);
            }

            sale.paymentDays = newPayments.join(',');
            saveSaleToStorage(sale);
        }

        function addPaymentDayToSale(dayNumber) {
            const day = Number(dayNumber);
            if (isNaN(day) || day < 1 || day > 31) return;
            const saleRaw = localStorage.getItem('saleDetails');
            if (!saleRaw) return;
            const sale = JSON.parse(saleRaw);

            const payments = (sale.paymentDays || '')
                .split(',')
                .map(s => s.trim())
                .filter(s => s !== '')
                .map(Number)
                .filter(n => !isNaN(n));

            if (!payments.includes(day)) payments.push(day);
            payments.sort((a,b)=>a-b);
            sale.paymentDays = payments.join(',');
            saveSaleToStorage(sale);
        }

        function removePaymentById(paymentIdOrIndex) {
            const saleRaw = localStorage.getItem('saleDetails');
            if (!saleRaw) return;
            const sale = JSON.parse(saleRaw);
            if (!Array.isArray(sale.payments)) return;

            let newPayments;
            if (typeof paymentIdOrIndex === 'string') {
                newPayments = sale.payments.filter(p => String(p._id || p.id || '') !== paymentIdOrIndex);
            } else if (typeof paymentIdOrIndex === 'number') {
                newPayments = sale.payments.slice();
                newPayments.splice(paymentIdOrIndex, 1);
            } else {
                return;
            }
            sale.payments = newPayments;
            sale.totalPaid = (sale.payments || []).reduce((s,p)=> s + Number(p.amount || 0), 0);
            saveSaleToStorage(sale);
        }

        function addPayment(paymentObject) {
            const saleRaw = localStorage.getItem('saleDetails');
            if (!saleRaw) return;
            const sale = JSON.parse(saleRaw);
            sale.payments = sale.payments || [];
            sale.payments.push(paymentObject);
            sale.totalPaid = (sale.payments || []).reduce((s,p)=> s + Number(p.amount || 0), 0);
            saveSaleToStorage(sale);
        }
    </script>
</body>
</html>
