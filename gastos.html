<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Gastos</title>
    <script src="adminMode.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/app-theme.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-icon"><i class="fas fa-money-bill-wave"></i></div>
            <div class="header-text">
                <h1>Registro de Gastos</h1>
                <p>Gestiona y registra todos tus gastos operacionales</p>
            </div>
        </header>

        <div class="total-expenses">
            <h2 id="totalExpenses">$0</h2>
            <p>Total de gastos pendientes de liquidar</p>
        </div>

        <div class="form-container">
            <h2 class="form-title">Registrar Nuevo Gasto</h2>
            <input type="hidden" id="expenseId" value="">

            <div class="form-group">
                <label for="expenseDate">
                    <i class="fas fa-calendar"></i> Fecha del Gasto
                </label>
                <input type="date" id="expenseDate" required>
            </div>

            <div class="form-group">
                <label for="expenseCount">
                    <i class="fas fa-list-ol"></i> ¿Cuántos gastos desea registrar?
                </label>
                <input type="number" id="expenseCount" min="1" max="20" placeholder="Ej: 3" required>
            </div>

            <div id="expenseItemsContainer" class="expense-items-container hidden"></div>

            <div class="button-group">
                <button type="button" class="btn btn-success" id="saveExpense">
                    <i class="fas fa-save"></i> Guardar Gastos
                </button>
                <button type="button" class="btn btn-primary hidden" id="updateExpense">
                    <i class="fas fa-edit"></i> Actualizar Gastos
                </button>
                <button type="button" class="btn btn-secondary" id="cancelExpense">
                    <i class="fas fa-times"></i> Cancelar
                </button>
            </div>
        </div>

        <div class="expenses-grid" id="expensesList">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando gastos...</p>
            </div>
        </div>

        <div class="empty-state hidden" id="emptyState">
            <i class="fas fa-receipt"></i>
            <h3>No hay gastos registrados</h3>
            <p>Aún no has registrado gastos pendientes de liquidar</p>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="categories.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
            </a>
        </div>
    </div>

    <script src="loader.js"></script>
    <script src="utils/selectAnimado.js"></script>
    <script src="utils/notifications.js" type="module"></script>
    <script src="utils/navigation.js" type="module"></script>
    <script type="module" src="gastos.js"></script>
</body>

</html>
