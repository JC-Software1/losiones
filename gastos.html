<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Gastos</title>
    <script src="adminMode.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/navigation.css">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --white: #ffffff;
            --light-gray: #f8f9fa;
            --medium-gray: #6c757d;
            --border: #e9ecef;
            --shadow: 0 2px 4px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 4px 12px rgba(0, 0, 0, 0.15);
            --radius: 8px;
            --radius-lg: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #faf8f3 0%, #f8f9fa 100%);
            color: var(--primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            text-align: center;
            border-left: 5px solid var(--danger);
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: var(--primary);
        }

        .total-expenses {
            background: linear-gradient(135deg, var(--danger), #c0392b);
            color: var(--white);
            border-radius: var(--radius-lg);
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: var(--shadow-hover);
        }

        .total-expenses h2 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .total-expenses p {
            opacity: 0.9;
            font-size: 16px;
        }

        .form-container {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }

        .form-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .expense-items-container {
            margin-top: 20px;
        }

        .expense-item {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
            padding: 15px;
            background: var(--light-gray);
            border-radius: var(--radius);
            border-left: 4px solid var(--danger);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-secondary {
            background: var(--medium-gray);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        .expenses-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        .expense-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 25px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            border-left: 4px solid var(--danger);
        }

        .expense-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .expense-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .expense-date {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
        }

        .expense-total {
            font-size: 24px;
            font-weight: 700;
            color: var(--danger);
        }

        .expense-items-list {
            margin: 15px 0;
        }

        .expense-item-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .expense-item-row:last-child {
            border-bottom: none;
        }

        .item-description {
            color: var(--dark);
            font-weight: 500;
        }

        .item-amount {
            color: var(--danger);
            font-weight: 600;
        }

        .expense-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--medium-gray);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--danger);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--medium-gray);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .expense-item {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .expense-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>
                <i class="fas fa-money-bill-wave"></i>
                Registro de Gastos
            </h1>
            <p>Gestiona y registra todos tus gastos operacionales</p>
        </div>

        <div class="total-expenses">
            <h2 id="totalExpenses">$0</h2>
            <p>Total de gastos pendientes de liquidar</p>
        </div>

        <div class="form-container">
            <h2 class="form-title">Registrar Nuevo Gasto</h2>
            <input type="hidden" id="expenseId" value="">

            <div class="form-group">
                <label for="expenseDate">
                    <i class="fas fa-calendar"></i> Fecha del Gasto
                </label>
                <input type="date" id="expenseDate" required>
            </div>

            <div class="form-group">
                <label for="expenseCount">
                    <i class="fas fa-list-ol"></i> ¿Cuántos gastos desea registrar?
                </label>
                <input type="number" id="expenseCount" min="1" max="20" placeholder="Ej: 3" required>
            </div>

            <div id="expenseItemsContainer" class="expense-items-container hidden"></div>

            <div class="button-group">
                <button type="button" class="btn btn-success" id="saveExpense">
                    <i class="fas fa-save"></i> Guardar Gastos
                </button>
                <button type="button" class="btn btn-primary hidden" id="updateExpense">
                    <i class="fas fa-edit"></i> Actualizar Gastos
                </button>
                <button type="button" class="btn btn-secondary" id="cancelExpense">
                    <i class="fas fa-times"></i> Cancelar
                </button>
            </div>
        </div>

        <div class="expenses-grid" id="expensesList">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando gastos...</p>
            </div>
        </div>

        <div class="empty-state hidden" id="emptyState">
            <i class="fas fa-receipt"></i>
            <h3>No hay gastos registrados</h3>
            <p>Aún no has registrado gastos pendientes de liquidar</p>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="categories.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
            </a>
        </div>
    </div>

    <script src="loader.js"></script>
    <script src="utils/notifications.js" type="module"></script>
    <script src="utils/navigation.js" type="module"></script>
    <script type="module" src="gastos.js"></script>
</body>

</html>
