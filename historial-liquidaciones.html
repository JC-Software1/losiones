<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Liquidaciones</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --white: #ffffff;
            --light-gray: #f8f9fa;
            --medium-gray: #6c757d;
            --border: #e9ecef;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
            --radius-lg: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--primary);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .liquidation-grid {
            display: grid;
            gap: 20px;
        }

        .liquidation-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 25px;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .liquidation-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .card-date {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
        }

        .card-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: var(--medium-gray);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
        }

        .stat-value.success { color: var(--success); }
        .stat-value.danger { color: var(--danger); }
        .stat-value.primary { color: var(--accent); }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--medium-gray);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--medium-gray);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i class="fas fa-history"></i>
                Historial de Liquidaciones
            </h1>
            <p>Registro de todas las liquidaciones realizadas</p>
        </div>

        <div style="margin-bottom: 20px; text-align: center;">
            <a href="liquidacion.html" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nueva Liquidación
            </a>
            <a href="categories.html" class="btn btn-primary">
                <i class="fas fa-arrow-left"></i> Volver
            </a>
        </div>

        <div id="loadingContainer" class="loading">
            <div class="spinner"></div>
            <p>Cargando historial...</p>
        </div>

        <div id="liquidationsContainer" class="liquidation-grid" style="display: none;"></div>
    </div>

    <script type="module">
        import { apiFetch } from "./utils/api.js";
        import { getToken } from "./utils/auth.js";

        document.addEventListener("DOMContentLoaded", loadHistory);

        async function loadHistory() {
            try {
                const token = getToken();
                const liquidations = await apiFetch("/liquidation/history", "GET", null, token);

                document.getElementById("loadingContainer").style.display = "none";

                if (liquidations.length === 0) {
                    document.getElementById("liquidationsContainer").innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <h3>No hay liquidaciones registradas</h3>
                            <p>Las liquidaciones que realices aparecerán aquí</p>
                        </div>
                    `;
                    document.getElementById("liquidationsContainer").style.display = "block";
                    return;
                }

                renderLiquidations(liquidations);
                document.getElementById("liquidationsContainer").style.display = "grid";

            } catch (error) {
                console.error("Error:", error);
                document.getElementById("loadingContainer").innerHTML = `
                    <div style="color: var(--danger);">
                        <i class="fas fa-exclamation-circle" style="font-size: 48px;"></i>
                        <p>Error al cargar el historial</p>
                    </div>
                `;
            }
        }

        function renderLiquidations(liquidations) {
            const container = document.getElementById("liquidationsContainer");
            
            container.innerHTML = liquidations.map(liq => `
                <div class="liquidation-card">
                    <div class="card-header">
                        <div class="card-date">
                            <i class="fas fa-calendar"></i>
                            ${new Date(liq.liquidationDate).toLocaleDateString('es-CO', { 
                                year: 'numeric', 
                                month: 'long', 
                                day: 'numeric' 
                            })}
                        </div>
                    </div>

                    <div class="card-stats">
                        <div class="stat-item">
                            <div class="stat-label">Caja Inicial</div>
                            <div class="stat-value">$${liq.initialCash.toLocaleString('es-CO')}</div>
                        </div>

                        <div class="stat-item">
                            <div class="stat-label">Total Ingresos</div>
                            <div class="stat-value success">$${liq.totalIncome.toLocaleString('es-CO')}</div>
                        </div>

                        <div class="stat-item">
                            <div class="stat-label">Total Egresos</div>
                            <div class="stat-value danger">$${liq.totalExpenses.toLocaleString('es-CO')}</div>
                        </div>

                        <div class="stat-item">
                            <div class="stat-label">Caja Final</div>
                            <div class="stat-value primary">$${liq.finalCash.toLocaleString('es-CO')}</div>
                        </div>
                    </div>

                    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); font-size: 13px; color: var(--medium-gray);">
                        <div><i class="fas fa-hand-holding-usd"></i> ${liq.payments.count} abonos</div>
                        <div><i class="fas fa-shopping-cart"></i> ${liq.sales.count} ventas</div>
                        <div><i class="fas fa-boxes"></i> ${liq.inventory.productCount} productos</div>
                    </div>

                    ${liq.notes ? `<div style="margin-top: 10px; padding: 10px; background: var(--light-gray); border-radius: 6px; font-size: 13px;"><strong>Notas:</strong> ${liq.notes}</div>` : ''}

                    <div class="action-buttons">
                        <button class="btn btn-danger" onclick="deleteLiquidation('${liq._id}')">
                            <i class="fas fa-trash"></i> Eliminar
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.deleteLiquidation = async function(id) {
            if (!confirm("¿Estás seguro de eliminar esta liquidación?")) return;

            try {
                const token = getToken();
                await apiFetch(`/liquidation/${id}`, "DELETE", null, token);
                alert("Liquidación eliminada");
                loadHistory();
            } catch (error) {
                alert("Error al eliminar: " + error.message);
            }
        };
    </script>
</body>
</html>
