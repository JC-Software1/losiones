<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustes del Sistema</title>
    <script src="adminMode.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/navigation.css">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --light: #ecf0f1;
            --white: #ffffff;
            --dark: #2c3e50;
            --cream: #faf8f3;
            --light-gray: #f8f9fa;
            --medium-gray: #6c757d;
            --border: #e9ecef;
            --shadow: 0 2px 4px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 4px 12px rgba(0, 0, 0, 0.15);
            --radius: 8px;
            --radius-lg: 12px;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, var(--cream) 0%, var(--light-gray) 100%); color: var(--dark); line-height: 1.5; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 16px; min-height: 100vh; }

        .header {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            border: 1px solid var(--border);
        }
        .header h1 { color: var(--primary); font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        .header p { color: var(--medium-gray); font-size: 14px; }

        .settings-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .settings-card h3 {
            font-size: 18px;
            color: var(--primary);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(52,152,219,0.1);
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
            background-color: #ccc;
            border-radius: 34px;
            transition: .4s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            border-radius: 50%;
            transition: .4s;
        }

        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(24px); }

        .btn-save {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent), #2980b9);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cogs"></i> Ajustes del Sistema</h1>
            <p>Configuración general y facturación electrónica</p>
        </div>

        <div class="settings-card">
            <h3><i class="fas fa-file-invoice"></i> Facturación Electrónica (Matias API)</h3>
            
            <div class="form-group">
                <label class="toggle-switch">
                    <input type="checkbox" id="enableBilling">
                    <span class="slider"></span>
                    <span style="font-weight: 500;">Activar Facturación Electrónica</span>
                </label>
            </div>

            <div id="billingConfig" style="display: none; margin-top: 20px;">
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;">
                    <div class="form-group">
                        <label>Entorno</label>
                        <select id="matiasEnvironment" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px;">
                            <option value="sandbox">Sandbox (Pruebas)</option>
                            <option value="production">Producción</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Token (PAT) *</label>
                        <input type="password" id="apiToken" placeholder="Pegue el token para actualizarlo">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;">
                    <div class="form-group">
                        <label>NIT Restaurante *</label>
                        <input type="text" id="matiasNit" placeholder="Ej: 900123456">
                    </div>
                    <div class="form-group">
                        <label>Dígito Verificación</label>
                        <input type="text" id="matiasDv" placeholder="Ej: 1">
                    </div>
                    <div class="form-group">
                        <label>Razón Social</label>
                        <input type="text" id="matiasNombreEmpresa" placeholder="Razón social">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;">
                    <div class="form-group">
                        <label>Núm. Resolución *</label>
                        <input type="text" id="matiasResolutionNumber" placeholder="Ej: 18760000001">
                    </div>
                    <div class="form-group">
                        <label>Prefijo Factura</label>
                        <input type="text" id="matiasPrefix" placeholder="Ej: FEV">
                    </div>
                    <div class="form-group">
                        <label>Rango Desde/Hasta</label>
                        <div style="display: flex; gap: 5px;">
                            <input type="number" id="matiasFrom" placeholder="Desde" style="width: 50%;">
                            <input type="number" id="matiasTo" placeholder="Hasta" style="width: 50%;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Consecutivo Actual</label>
                        <input type="number" id="matiasCurrentNumber" placeholder="Factura actual">
                    </div>
                </div>
            </div>
            
            <button class="btn-save" onclick="saveSettings()">
                <i class="fas fa-save"></i> Guardar Ajustes
            </button>
        </div>
    </div>

    <script src="utils/notifications.js" type="module"></script>
    <script src="utils/navigation.js" type="module"></script>
    <script type="module" src="ajustes.js"></script>
</body>

</html>
