<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Registro — JC</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Poppins:wght@300;500;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --dark-1: #0f0f11;
      --dark-2: #141418;
      --panel-dark: #151416;
      --orange-1: #d96a39;
      --orange-2: #ff7f3d;
      --glass: rgba(255, 255, 255, 0.03);
      --text-light: #f2efe9;
      --muted: rgba(255, 255, 255, 0.55);
      --card-radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html, body {
      height: 100%
    }

    body {
      font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, #0b0b0c 0%, #0b0b0c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: var(--text-light);
    }

    .card {
      width: 100%;
      max-width: 500px;
      border-radius: var(--card-radius);
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 0 0 2px rgba(217, 106, 57, 0.06);
      border: 3px solid rgba(217, 106, 57, 0.06);
      background: linear-gradient(180deg, rgba(21, 21, 22, 0.98) 0%, rgba(22, 22, 24, 0.98) 100%);
      padding: 40px;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      color: var(--orange-2);
      margin-bottom: 8px;
    }

    .header p {
      color: var(--muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: var(--text-light);
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-light);
      transition: all 0.3s;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--orange-1);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 0 4px rgba(217, 106, 57, 0.1);
    }

    .form-group input::placeholder {
      color: var(--muted);
    }

    .btn-register {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--orange-1), var(--orange-2));
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(217, 106, 57, 0.4);
    }

    .btn-register:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .login-link a {
      color: var(--orange-2);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s;
    }

    .login-link a:hover {
      color: var(--orange-1);
      text-decoration: underline;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 10px;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid var(--orange-2);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <h1>Crear Cuenta</h1>
      <p>Únete a JC-C</p>
    </div>

    <div id="alertContainer"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">Nombre Completo</label>
        <input type="text" id="name" name="name" required autocomplete="name" placeholder="Tu nombre">
      </div>

      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="Tu usuario">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder="Repite tu contraseña">
      </div>

      <div class="form-group">
        <label for="tipo">Rol</label>
        <select id="tipo" name="tipo">
          <option value="1">Administrador</option>
          <option value="2">Vendedor</option>
        </select>
      </div>

      <button type="submit" class="btn-register" id="submitBtn">
        Crear Cuenta
      </button>

      <div class="loading" id="loading">
        <div class="spinner"></div>
      </div>
    </form>

    <div class="login-link">
      ¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a>
    </div>
  </div>

  <script>
    const API_URL = 'https://losiones-fjt0.onrender.com/api/auth';

    function showAlert(message, type) {
      const alert = document.createElement('div');
      alert.className = `alert alert-${type} show`;
      alert.textContent = message;
      document.getElementById('alertContainer').innerHTML = '';
      document.getElementById('alertContainer').appendChild(alert);

      setTimeout(() => {
        alert.remove();
      }, 5000);
    }

    function setLoading(isLoading) {
      const btn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');

      if (isLoading) {
        btn.disabled = true;
        btn.textContent = 'Registrando...';
        loading.classList.add('active');
      } else {
        btn.disabled = false;
        btn.textContent = 'Crear Cuenta';
        loading.classList.remove('active');
      }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const tipo = document.getElementById('tipo').value;

      if (!name || !username || !password || !confirmPassword) {
        showAlert('Por favor complete todos los campos', 'error');
        return;
      }

      if (password.length < 6) {
        showAlert('La contraseña debe tener al menos 6 caracteres', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('Las contraseñas no coinciden', 'error');
        return;
      }

      setLoading(true);

      try {
        const response = await fetch(`${API_URL}/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name,
            username,
            password,
            tipo: tipo
          })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert(data.message || '¡Cuenta creada exitosamente! Redirigiendo...', 'success');
          
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          showAlert(data.error || 'Error al crear la cuenta', 'error');
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert('Error de conexión. Por favor intente nuevamente', 'error');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>

</html>
