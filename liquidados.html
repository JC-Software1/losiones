<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Liquidados</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* ========== Variables CSS (copiadas de historial.html) ========== */
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --light: #ecf0f1;
            --white: #ffffff;
            --dark: #2c3e50;
            --beige: #f5f5dc;
            --cream: #faf8f3;
            --light-gray: #f8f9fa;
            --medium-gray: #6c757d;
            --border: #e9ecef;
            --shadow: 0 2px 4px rgba(0,0,0,0.08);
            --shadow-hover: 0 4px 12px rgba(0,0,0,0.15);
            --radius: 8px;
            --radius-lg: 12px;
            --transition: all 0.3s ease;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background:linear-gradient(135deg,var(--cream) 0%,var(--light-gray) 100%);
            color:var(--dark);
            line-height:1.5;
            min-height:100vh;
        }
        .container{max-width:100%;margin:0 auto;padding:16px;min-height:100vh}

        /* ---------- Header ---------- */
        .header{
            background:var(--white);
            border-radius:var(--radius-lg);
            padding:20px;
            margin-bottom:20px;
            box-shadow:var(--shadow);
            text-align:center;
            border:1px solid var(--border);
        }
        .header h1{color:var(--primary);font-size:24px;font-weight:600;margin-bottom:8px}
        .header p{color:var(--medium-gray);font-size:14px}

        /* ---------- Menú (mismo que historial) ---------- */
        .menu-toggle{
            position:fixed;
            top:18px;
            right:18px;
            width:52px;
            height:52px;
            background:var(--white);
            border:1px solid var(--border);
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            box-shadow:var(--shadow);
            z-index:10010;
            transition:transform .22s ease,background .22s ease,color .22s ease;
        }
        .menu-toggle:active{transform:scale(.98)}
        .menu-toggle:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
        .menu-toggle .menu-icon{font-size:18px;color:var(--primary)}
        .menu-toggle.open{background:var(--primary);color:var(--white)}
        .menu-toggle.open .menu-icon{color:var(--white)}
        .backdrop{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.45);
            z-index:10005;
            opacity:0;
            visibility:hidden;
            transition:opacity .28s ease,visibility .28s;
        }
        .backdrop.show{opacity:1;visibility:visible}
        .menu-items{
            position:fixed;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%) scale(.92);
            min-width:260px;
            max-width:92%;
            background:linear-gradient(180deg,var(--white),#fbfbfb);
            border-radius:14px;
            padding:14px;
            box-shadow:0 20px 50px rgba(0,0,0,.22);
            z-index:10010;
            opacity:0;
            visibility:hidden;
            transition:transform .32s cubic-bezier(.2,.9,.2,1),opacity .22s ease,visibility .22s;
            border:1px solid rgba(0,0,0,.03);
            overflow:hidden;
            outline:0;
        }
        .menu-items.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
        .menu-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:10px}
        .menu-head strong{color:var(--primary);font-size:14px}
        .menu-close{background:transparent;border:none;font-size:16px;color:var(--medium-gray);cursor:pointer;padding:6px;border-radius:8px}
        .menu-close:hover{color:var(--danger);transform:translateY(-2px)}
        .menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:stretch}
        .menu-link{display:flex;gap:10px;align-items:center;justify-content:center;text-decoration:none;background:linear-gradient(180deg,#fff,var(--light-gray));padding:10px;border-radius:10px;border:1px solid rgba(0,0,0,.03);box-shadow:0 6px 18px rgba(0,0,0,.06);transition:transform .18s ease,box-shadow .18s ease,background .18s;color:var(--primary);font-weight:600;font-size:13px;text-align:center}
        .menu-link i{font-size:16px;width:20px;text-align:center;color:var(--accent)}
        .menu-link span{display:inline-block;line-height:1}
        .menu-link:hover{transform:translateY(-6px);box-shadow:0 14px 36px rgba(0,0,0,.14);background:linear-gradient(180deg,var(--accent),#2a86c8);color:#fff}
        .menu-link:hover i{color:#fff}
        @media (max-width:420px){.menu-grid{grid-template-columns:repeat(3,1fr);gap:8px}.menu-link{padding:8px;font-size:12px;border-radius:8px}}
        .menu-link{opacity:0;transform:translateY(6px) scale(.995);transition-property:transform,opacity,box-shadow,background;transition-duration:320ms}
        .menu-items.show .menu-link{opacity:1;transform:translateY(0) scale(1)}
        .menu-link:focus{outline:3px solid rgba(52,152,219,.18);transform:translateY(-3px)}

        /* ---------- Búsqueda y filtros ---------- */
        .search-container{margin:20px 0;display:flex;gap:12px;flex-wrap:wrap}
        .search-input{flex:1;min-width:200px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--white);font-size:16px;transition:var(--transition)}
        .search-input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(52,152,219,.1)}
        .date-filter{flex:0 0 200px;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--white);font-size:16px;transition:var(--transition)}
        .date-filter:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(52,152,219,.1)}

        /* ---------- Total liquidado ---------- */
        .total-liquidated{
            background:linear-gradient(135deg,var(--success),#2ecc71);
            color:var(--white);
            border-radius:var(--radius-lg);
            padding:24px;
            text-align:center;
            margin-bottom:24px;
        }
        .total-liquidated h2{font-size:24px;margin-bottom:8px}
        .total-liquidated p{opacity:.9;font-size:14px}

        /* ---------- Estadísticas ---------- */
        .stats-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:16px;
            margin-bottom:24px;
        }
        .stat-card{
            background:var(--white);
            border-radius:var(--radius-lg);
            padding:20px;
            box-shadow:var(--shadow);
            border:1px solid var(--border);
            text-align:center;
            transition:var(--transition);
        }
        .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
        .stat-icon{
            width:48px;
            height:48px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 12px;
            font-size:20px;
            color:var(--white);
        }
        .stat-icon.success{background:linear-gradient(135deg,var(--success),#2ecc71)}
        .stat-icon.warning{background:linear-gradient(135deg,var(--warning),#e67e22)}
        .stat-icon.info{background:linear-gradient(135deg,var(--accent),#2980b9)}
        .stat-value{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:4px}
        .stat-label{font-size:14px;color:var(--medium-gray)}

        /* ---------- Listado (mismo estilo que historial) ---------- */
        .sales-grid{display:grid;gap:16px;margin-bottom:24px}
        .sale-card{background:var(--white);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);transition:var(--transition);position:relative}
        .sale-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
        .sale-card.liquidated{border-left:4px solid var(--success)}
        .sale-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
        .sale-info h3{font-size:16px;font-weight:600;color:var(--primary);margin-bottom:4px}
        .sale-info p{font-size:14px;color:var(--medium-gray)}
        .sale-amount{text-align:right}
        .liquidated-amount{font-size:18px;font-weight:700;color:var(--success)}
        .liquidated-badge{
            background:linear-gradient(135deg,var(--success),#2ecc71);
            color:var(--white);
            padding:4px 12px;
            border-radius:20px;
            font-size:12px;
            font-weight:600;
            margin-bottom:8px;
            display:inline-block;
        }
        .sale-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
        .meta-item{display:flex;align-items:center;gap:8px;font-size:14px}
        .meta-item i{width:16px;color:var(--accent)}
        .meta-value{font-weight:600;color:var(--primary)}
        .liquidation-period{
            background:linear-gradient(135deg,rgba(39,174,96,0.1),rgba(46,204,113,0.05));
            border:1px solid rgba(39,174,96,0.2);
            border-radius:var(--radius);
            padding:12px;
            margin:12px 0;
        }
        .period-text{font-size:14px;color:var(--success);font-weight:600;text-align:center}
        .sale-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
        .sale-actions .btn{flex:1;min-width:80px;justify-content:center}

        /* ---------- Estados vacíos / loading ---------- */
        .empty-state{text-align:center;padding:40px 20px;color:var(--medium-gray)}
        .empty-state i{font-size:48px;margin-bottom:16px;opacity:.5}
        .loading{display:flex;justify-content:center;align-items:center;padding:40px}
        .spinner{width:32px;height:32px;border:3px solid var(--light-gray);border-top:3px solid var(--success);border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

        /* ---------- Botones de acción ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: var(--radius);
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        .btn i {font-size: 15px;}
        .btn-info {
            background: linear-gradient(135deg, var(--accent), #2980b9);
            color: var(--white);
        }
        .btn-info:hover {
            background: linear-gradient(135deg, #2980b9, var(--accent));
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #c0392b);
            color: var(--white);
        }
        .btn-danger:hover {
            background: linear-gradient(135deg, #c0392b, var(--danger));
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .btn:active {transform: scale(0.96);}

        /* ---------- Responsive ---------- */
        @media (max-width:768px){
            .container{padding:12px}
            .sale-actions{flex-direction:column}
            .sale-actions .btn{flex:none}
            .stats-grid{grid-template-columns:1fr}
            .sale-meta{grid-template-columns:1fr}
        }
        .hidden{display:none !important}
    </style>
</head>
<body>

    <!-- ========== MENÚ (igual que historial) ========== -->
    <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="menuItems" aria-label="Abrir menú">
        <span class="menu-icon"><i class="fas fa-bars"></i></span>
    </button>
    <div class="backdrop" id="backdrop"></div>
    <nav class="menu-items" id="menuItems" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="menu-head">
            <strong>Acciones rápidas</strong>
            <button class="menu-close" id="menuClose" aria-label="Cerrar menú"><i class="fas fa-times"></i></button>
        </div>
        <div class="menu-grid">
            <a href="categories.html" class="menu-link"><i class="fas fa-user-plus"></i><span>Agregar cliente</span></a>
            <a href="abonos.html" class="menu-link"><i class="fas fa-receipt"></i><span>Historial de abonos</span></a>
            <a href="historial.html" class="menu-link"><i class="fas fa-history"></i><span>Historial</span></a>
            <a href="productos.html" class="menu-link"><i class="fas fa-box-open"></i><span>Agregar producto</span></a>
            <a href="inventario.html" class="menu-link"><i class="fas fa-warehouse"></i><span>Inventario</span></a>
            <a href="vendidos.html" class="menu-link"><i class="fas fa-tags"></i><span>Productos vendidos</span></a>
            <center><a href="recibos.html" class="menu-link"><i class="fas fa-file-alt"></i><span>Recibos</span></a></center>
        </div>
    </nav>

    <div class="container">
        <!-- ---------- HEADER ---------- -->
        <div class="header">
            <h1><i class="fas fa-check-circle"></i> Historial de Liquidados</h1>
            <p>Registro completo de todas las ventas liquidadas exitosamente</p>
        </div>

        <!-- ---------- TOTAL LIQUIDADO ---------- -->
        <div class="total-liquidated">
            <h2 id="totalLiquidated">$0</h2>
            <p>Total acumulado liquidado</p>
        </div>

        <!-- ---------- ESTADÍSTICAS ---------- -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon success">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Ventas liquidadas</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon warning">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <div class="stat-value" id="avgDays">0</div>
                <div class="stat-label">Días promedio</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon info">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="stat-value" id="thisMonth">$0</div>
                <div class="stat-label">Este mes</div>
            </div>
        </div>

        <!-- ---------- BÚSQUEDA Y FILTROS ---------- -->
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar cliente por nombre...">
            <input type="date" class="date-filter" id="dateFilter" title="Filtrar por fecha de liquidación">
            <button class="btn btn-info" onclick="showAdvancedStats()" title="Ver estadísticas detalladas">
                <i class="fas fa-chart-bar"></i> Estadísticas
            </button>
            <button class="btn btn-info" onclick="exportLiquidatedData()" title="Exportar datos a CSV">
                <i class="fas fa-download"></i> Exportar
            </button>
        </div>

        <!-- ---------- LISTADO ---------- -->
        <div class="sales-grid" id="liquidatedHistory">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <!-- ---------- SCRIPTS ---------- -->
    <script type="module" src="liquidados.js"></script>
</body>
</html>
