<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Liquidados</title>
    <script src="adminMode.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/app-theme.css">
</head>

<body>

    <!-- ========== MENÚ (igual que historial) ========== -->
    <!-- Menú Removido -->

    <div class="container">
        <!-- ---------- HEADER ---------- -->
        <header class="header">
            <div class="header-icon"><i class="fas fa-check-circle"></i></div>
            <div class="header-text">
                <h1>Historial de Liquidados</h1>
                <p>Registro completo de todas las ventas liquidadas exitosamente</p>
            </div>
        </header>

        <!-- ---------- TOTAL LIQUIDADO ---------- -->
        <div class="total-liquidated">
            <h2 id="totalLiquidated">$0</h2>
            <p>Total acumulado liquidado</p>
        </div>

        <!-- ---------- ESTADÍSTICAS ---------- -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon success">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Ventas liquidadas</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon warning">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <div class="stat-value" id="avgDays">0</div>
                <div class="stat-label">Días promedio</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon info">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="stat-value" id="thisMonth">$0</div>
                <div class="stat-label">Este mes</div>
            </div>
        </div>

        <!-- ---------- BÚSQUEDA Y FILTROS ---------- -->
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar cliente por nombre...">
            <input type="date" class="date-filter" id="dateFilter" title="Filtrar por fecha de liquidación">
            <button class="btn btn-info" onclick="showAdvancedStats()" title="Ver estadísticas detalladas">
                <i class="fas fa-chart-bar"></i> Estadísticas
            </button>
            <button class="btn btn-info" onclick="exportLiquidatedData()" title="Exportar datos a CSV">
                <i class="fas fa-download"></i> Exportar
            </button>
        </div>

        <!-- ---------- LISTADO ---------- -->
        <div class="sales-grid" id="liquidatedHistory">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <!-- ---------- SCRIPTS ---------- -->
    <script src="utils/selectAnimado.js"></script>
    <script src="utils/notifications.js" type="module"></script>
    <script src="utils/navigation.js" type="module"></script>
    <script type="module" src="liquidados.js"></script>
</body>

</html>
