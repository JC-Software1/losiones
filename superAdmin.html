<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Panel Super-Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/notifications.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --warning-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      --danger-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      --dark-gradient: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);

      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-primary: #2c3e50;
      --text-secondary: #7f8c8d;
      --shadow-light: 0 8px 32px rgba(0, 0, 0, 0.1);
      --shadow-medium: 0 12px 40px rgba(0, 0, 0, 0.15);
      --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: scroll;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="%23ffffff" fill-opacity="0.02"/><circle cx="75" cy="75" r="1" fill="%23ffffff" fill-opacity="0.02"/><circle cx="50" cy="10" r="0.5" fill="%23ffffff" fill-opacity="0.03"/><circle cx="10" cy="90" r="0.5" fill="%23ffffff" fill-opacity="0.03"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
      pointer-events: none;
      z-index: 1;
    }

    .admin-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    /* Header Glassmorphism */
    .header {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px 40px;
      margin-bottom: 32px;
      box-shadow: var(--shadow-medium);
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary-gradient);
    }

    .header-content {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 32px;
      align-items: center;
    }

    .header-info h1 {
      font-size: 2.8rem;
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .header-subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.1rem;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    /* Buttons */
    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.6s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-medium);
    }

    .btn-primary {
      background: var(--success-gradient);
      color: white;
    }

    .btn-danger {
      background: var(--danger-gradient);
      color: white;
    }

    /* Dashboard Cards */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow-light);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--primary-gradient);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-medium);
    }

    .stat-value {
      font-size: 3rem;
      font-weight: 800;
      color: white;
      margin-bottom: 8px;
      line-height: 1;
    }

    .stat-label {
      color: rgba(255, 255, 255, 0.8);
      font-size: 1rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Users Section */
    .users-section {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow-medium);
      position: relative;
      overflow: hidden;
    }

    .users-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--secondary-gradient);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Users Grid */
    .users-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 24px;
    }

    .user-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow-light);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .user-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--primary-gradient);
    }

    .user-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: var(--shadow-heavy);
    }

    .user-header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 20px;
      align-items: start;
      margin-bottom: 24px;
    }

    .user-avatar {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      box-shadow: var(--shadow-light);
    }

    .user-main-info h3 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .user-username {
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .user-badges {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    .user-status,
    .user-type {
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-active {
      background: var(--success-gradient);
      color: white;
    }

    .status-blocked {
      background: var(--danger-gradient);
      color: white;
    }

    .type-superadmin {
      background: var(--dark-gradient);
      color: white;
    }

    .type-admin {
      background: var(--warning-gradient);
      color: white;
    }

    .type-user {
      background: var(--primary-gradient);
      color: white;
    }

    .user-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .detail-item {
      background: rgba(108, 117, 125, 0.1);
      padding: 12px 16px;
      border-radius: 12px;
    }

    .detail-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 0.9rem;
      color: var(--text-primary);
      font-weight: 600;
      word-break: break-all;
    }

    .user-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 11px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-sm::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.4s;
    }

    .btn-sm:hover::before {
      left: 100%;
    }

    .btn-sm:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .btn-edit {
      background: var(--primary-gradient);
      color: white;
    }

    .btn-block {
      background: var(--danger-gradient);
      color: white;
    }

    .btn-unblock {
      background: var(--success-gradient);
      color: white;
    }

    .btn-inspect {
      background: var(--warning-gradient);
      color: white;
    }

    .btn-delete {
      background: var(--dark-gradient);
      color: white;
    }

    .btn-sm:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 9999;
      overflow-y: auto;
    }

    .modal-content {
      position: relative;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      border-radius: 24px;
      padding: 40px;
      width: 90%;
      max-width: 520px;
      box-shadow: var(--shadow-heavy);
      margin: 40px auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 2px solid #f8f9fa;
    }

    .modal-title {
      font-size: 1.6rem;
      color: var(--text-primary);
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 8px;
      border-radius: 50%;
      transition: all 0.3s ease;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      background: #f8f9fa;
      color: #e74c3c;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .form-input,
    .form-select {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }

    .form-input:focus,
    .form-select:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 32px;
    }

    .btn-save {
      background: var(--success-gradient);
      color: white;
    }

    .btn-cancel {
      background: var(--text-secondary);
      color: white;
    }

    /* Scroll to top button */
    .scroll-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--primary-gradient);
      color: white;
      border: none;
      border-radius: 20px;
      width: 64px;
      height: 64px;
      font-size: 24px;
      cursor: pointer;
      box-shadow: var(--shadow-medium);
      transition: all 0.3s ease;
      z-index: 1000;
      display: none;
    }

    .scroll-to-top:hover {
      transform: translateY(-4px) scale(1.1);
      box-shadow: var(--shadow-heavy);
    }

    .scroll-to-top.show {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bounceIn 0.5s ease;
    }

    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }

      50% {
        opacity: 1;
        transform: scale(1.1);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Loading state */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.2rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .admin-container {
        padding: 16px;
      }

      .users-grid {
        grid-template-columns: 1fr;
      }

      .header-content {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .user-details {
        grid-template-columns: 1fr;
      }

      .header-info h1 {
        font-size: 2.2rem;
      }

      .section-title {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 480px) {
      .modal-content {
        padding: 24px;
      }

      .user-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="admin-container">
    <!-- Header -->
    <div class="header">
      <div class="header-content">
        <div class="header-info">
          <h1>🛡️ Panel Super Admin</h1>
          <div class="header-subtitle" id="userInfo">Cargando información...</div>
        </div>
        <div class="header-actions">
          <button class="btn btn-primary" id="addUserBtn">
            ➕ Nuevo Usuario
          </button>
          <button class="btn btn-danger" id="logoutBtn">
            🚪 Cerrar Sesión
          </button>
        </div>
      </div>
    </div>

    <!-- Dashboard Stats -->
    <div class="dashboard-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalUsers">0</div>
        <div class="stat-label">Total Usuarios</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="activeUsers">0</div>
        <div class="stat-label">Usuarios Activos</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="blockedUsers">0</div>
        <div class="stat-label">Usuarios Bloqueados</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="adminUsers">0</div>
        <div class="stat-label">Administradores</div>
      </div>
    </div>

    <!-- Users Section -->
    <div class="users-section">
      <div class="section-header" style="display: flex; flex-wrap: wrap; gap: 16px;">
        <h2 class="section-title">👥 Gestión de Usuarios</h2>
        <div class="search-container" style="flex: 1; min-width: 200px; display: flex; justify-content: flex-end;">
          <input type="text" id="userSearchInput" class="form-input" placeholder="Buscar por nombre o usuario..." style="max-width: 300px; padding: 10px 16px;">
        </div>
      </div>
      <div class="users-grid" id="usersGrid">
        <div class="loading">
          🔄 Cargando usuarios...
        </div>
      </div>
    </div>
  </div>

  <!-- Scroll to top button -->
  <button class="scroll-to-top" id="scrollToTop" title="Volver arriba">↑</button>

  <!-- Modal para editar usuario -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">✏️ Editar Usuario</h3>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <form id="editForm">
        <input type="hidden" id="editUserId">

        <div class="form-group">
          <label class="form-label">Nombre Completo</label>
          <input type="text" class="form-input" id="editName" required>
        </div>

        <div class="form-group">
          <label class="form-label">Nombre de Usuario</label>
          <input type="text" class="form-input" id="editUsername" required>
        </div>

        <div class="form-group">
          <label class="form-label">Nueva Contraseña (opcional)</label>
          <input type="password" class="form-input" id="editPassword" placeholder="Dejar vacío para mantener actual">
        </div>

        <div class="form-group">
          <label class="form-label">Tipo de Usuario</label>
          <select class="form-select" id="editTipo" required>
            <option value="1">👤 Usuario Normal</option>
            <option value="2">👨‍💼 Administrador</option>
            <option value="3">🛡️ Super Administrador</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-cancel" id="cancelEdit">Cancelar</button>
          <button type="submit" class="btn btn-save">💾 Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal para agregar usuario -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">➕ Agregar Nuevo Usuario</h3>
        <button class="close-btn" id="closeAddModal">&times;</button>
      </div>
      <form id="addForm">
        <div class="form-group">
          <label class="form-label">Nombre Completo</label>
          <input type="text" class="form-input" id="addName" required>
        </div>

        <div class="form-group">
          <label class="form-label">Nombre de Usuario</label>
          <input type="text" class="form-input" id="addUsername" required>
        </div>

        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-input" id="addPassword" required>
        </div>

        <div class="form-group">
          <label class="form-label">Tipo de Usuario</label>
          <select class="form-select" id="addTipo" required>
            <option value="1">👤 Usuario Normal</option>
            <option value="2">👨‍💼 Administrador</option>
            <option value="3">🛡️ Super Administrador</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-cancel" id="cancelAdd">Cancelar</button>
          <button type="submit" class="btn btn-save">➕ Crear Usuario</button>
        </div>
      </form>
    </div>
  </div>

  <script src="utils/notifications.js" type="module"></script>
  <script type="module" src="superAdmin.js"></script>
</body>

</html>
